# The checks that run on every push and pull request. No deploy step: the
# backend is pushed by hand (python tools/deploy-backend.py) and the pages are
# served by GitHub Pages from the branch itself.
name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend suites in the mocked Apps Script world
        run: node tests/run.js

      - name: Build integrity (service-worker cache name, shell files, build tags)
        run: node tools/test-build.js

      - name: Combined backend parses
        run: |
          python tools/build-combined.py
          node -e "new Function(require('fs').readFileSync('backend/COMBINED.gs','utf8'))"

      # This repository is public. The clasp working copy (script id, a
      # generated Code.gs that may name real mobile numbers), the real
      # district register and the importer's output must never be tracked.
      # app/js/config.js and console/js/config.js ARE tracked on purpose:
      # GitHub Pages serves them, and the deployment URL they carry is what
      # every phone fetches anyway; a script id or spreadsheet id is not.
      - name: No secrets or personal data in the tracked tree
        run: |
          set -e
          if git ls-files | grep -E '^\.clasp\.json$|^backend/clasp/|^master-data/|^input/.*\.xlsx$|^Play/|^request/'; then
            echo 'a secret or a real-data file is tracked'; exit 1; fi
          if git grep -n -E '"scriptId"\s*:' -- . ':!tools/' ':!docs/' ':!tests/' ':!.github/' ; then
            echo 'a script id is tracked'; exit 1; fi
          echo 'clean'
